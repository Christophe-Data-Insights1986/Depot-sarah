<svg xmlns="http://www.w3.org/2000/svg"
  width="512"
  height="512"
  viewBox="0 0 512 512">

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#166534"/>
      <stop offset="100%" stop-color="#052e16"/>
    </linearGradient>

<linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
  <stop offset="0%" stop-color="#fff0a6"/>
  <stop offset="50%" stop-color="#d4a72c"/>
  <stop offset="100%" stop-color="#f8df83"/>
</linearGradient>

  </defs>

  <!-- Fond -->

  <rect width="512" height="512" rx="110" fill="url(#bg)"/>

  <!-- Bordures -->

<circle cx="256" cy="256" r="222"
       fill="none" stroke="url(#gold)" stroke-width="12"/>

<circle cx="256" cy="256" r="207"
       fill="none" stroke="#ffffff"
       stroke-opacity="0.25" stroke-width="3"/>

  <!-- Bouteilles -->

  <g stroke="#ffffff" stroke-width="5" stroke-linejoin="round">

<rect x="137" y="105" width="48" height="118"
      rx="13" fill="#dc2626"/>

<rect x="148" y="87" width="26" height="25"
      rx="5" fill="#dc2626"/>

<rect x="219" y="88" width="48" height="135"
      rx="13" fill="#f97316"/>

<rect x="230" y="70" width="26" height="25"
      rx="5" fill="#f97316"/>

<rect x="301" y="105" width="48" height="118"
      rx="13" fill="#16a34a"/>

<rect x="312" y="87" width="26" height="25"
      rx="5" fill="#16a34a"/>

  </g>

  <!-- Étiquettes -->

<g fill="#ffffff"
  font-family="Arial, sans-serif"
  font-size="13"
  font-weight="bold"
  text-anchor="middle">

<text x="161" y="174">COLA</text>
<text x="243" y="174">ORANGE</text>
<text x="325" y="174">LIME</text>

  </g>

  <!-- Caisse -->

<path d="M112 225 H400 L378 278 H134 Z"
     fill="url(#gold)"
     stroke="#ffffff"
     stroke-width="5"/>

<path d="M145 237 V266
        M190 237 V266
        M235 237 V266
        M280 237 V266
        M325 237 V266
        M370 237 V266"
     stroke="#14532d"
     stroke-width="9"/>

  <!-- Nom -->

<text x="256" y="326"
     text-anchor="middle"
     fill="#ffffff"
     font-family="Arial, sans-serif"
     font-size="49"
     font-weight="bold">
DÉPÔT
</text>

<text x="256" y="389"
     text-anchor="middle"
     fill="url(#gold)"
     font-family="Arial, sans-serif"
     font-size="76"
     font-weight="900">
SARAH
</text>

  <!-- Séparation -->

<path d="M115 408 H397"
     stroke="url(#gold)"
     stroke-width="5"
     stroke-linecap="round"/>

  <!-- Slogan -->

<text x="256" y="440"
     text-anchor="middle"
     fill="#ffffff"
     font-family="Arial, sans-serif"
     font-size="19">
GESTION INTELLIGENTE
</text>

<text x="256" y="465"
     text-anchor="middle"
     fill="#ffffff"
     font-family="Arial, sans-serif"
     font-size="16">
STOCK • VENTES • FINANCES
</text>

</svg>